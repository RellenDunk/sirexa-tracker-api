services:
  api:
    build: .
    container_name: sirexa-tracker-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=Gagakshi
      - DB_PASSWORD=vR7$kL9@pX2#zQ8!mT5^bW1&nE3*uY6%
      - DB_NAME=sirexa
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: sirexa-tracker-db
    environment:
      - POSTGRES_USER=Gagakshi
      - POSTGRES_PASSWORD=vR7$kL9@pX2#zQ8!mT5^bW1&nE3*uY6%
      - POSTGRES_DB=sirexa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  adminer:
    image: adminer
    container_name: sirexa-tracker-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
  